# Servir a saída estática do Expo. O expo-router com output:static gera um HTML
# por rota (/inicio.html, /termos.html, /hoje.html...). O try_files mapeia
# /inicio -> /inicio.html e cai em index.html só quando nada casa.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Bundles com hash no nome: cache longo e imutável.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker e manifesto não podem ser cacheados de forma agressiva.
  location = /sw.js       { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.json { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # Rotas do app: tenta o arquivo, depois <rota>.html, depois cai no index.
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
