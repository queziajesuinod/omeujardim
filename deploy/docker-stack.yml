version: "3.9"

# ============================================================================
# O meu jardim — deploy no estilo Swarm + Traefik, clonando o repo em runtime
# (sem buildar imagem). Modelo do seu exemplo, encaixado neste projeto:
#
#   - Três serviços web, cada um no seu domínio (é assim que o projeto já é
#     pensado em deploy/.env: DOMINIO, API_DOMINIO, PAINEL_DOMINIO):
#       api.omeujardim.app     -> API Fastify (porta 3000)
#       omeujardim.app         -> app Expo (saída estática, servido por "serve")
#       painel.omeujardim.app  -> painel de gestão (HTML único)
#   Postgres e Redis são EXTERNOS a este stack (Postgres gerenciado via
#   DATABASE_URL; Redis é o serviço "redis" já existente no enxame). Ambos
#   precisam ser alcançáveis pela API — o Redis, pela rede network_public.
#
# Pressupõe um Traefik já rodando no enxame, com o entrypoint "websecure",
# o resolver "letsencryptresolver" e a rede externa "network_public" — igual
# ao seu exemplo. Não subimos Traefik aqui.
#
# Subir:   docker stack deploy -c deploy/docker-stack.yml jardim
# Ver:     docker service ls   |   docker service logs -f jardim_api
#
# TROQUE tudo marcado com <...>. Gere segredos NOVOS para produção:
#   openssl rand -base64 32   (JWT_SEGREDO, CRIPTO_CHAVE)
#   openssl rand -hex 16      (EFI_WEBHOOK_SEGREDO, se quiser)
#
# Diferenças em relação ao Dockerfile do projeto, de propósito, por causa do
# "clone em runtime":
#   - Não há bind mount de arquivos do repo (o Swarm roda em qualquer nó do
#     enxame). Por isso a extensoes.sql roda via psql a partir do container da
#     API, depois do clone, e não como initdb-script do Postgres.
#   - depends_on com condição NÃO vale em Swarm. A API espera o banco com
#     pg_isready antes de migrar; restart_policy cobre o resto.
#   - node:22 (imagem cheia) traz git, python3, make e g++, necessários para o
#     argon2 nativo compilar no npm ci. Não use a variante -slim aqui.
# ============================================================================

x-repo: &repo "https://github.com/queziajesuinod/omeujardim.git"   # <-- URL do repositório
x-ramo: &ramo "main"

services:
  # ---- API Fastify -------------------------------------------------------
  api:
    image: node:22
    networks:
      - network_public
    environment:
      REPO: *repo
      RAMO: *ramo
      NODE_ENV: production
      PORT: "3000"

      # Banco interno deste stack (serviço "banco"). Para um Postgres gerenciado
      # externo, troque a URL e ponha DB_SSL=true.
      DATABASE_URL: ""
      DB_SSL: "false"
      # Redis já existente no enxame (serviço "redis"), no database 7.
      # Precisa compartilhar a rede network_public com a API para o nome resolver.
      REDIS_URL: "redis://redis:6379/7"

      # App e painel, em https, sem espaços.
      CORS_ORIGENS: "https://omeujardim.app,https://painel.omeujardim.app"

      # Segredos — gere NOVOS, não reaproveite os de desenvolvimento.
      JWT_SEGREDO: "/="
      JWT_EXPIRA: "30m"
      REFRESH_EXPIRA_DIAS: "30"
      # Cifra o diário (AES-256-GCM). Perder esta chave = perder o diário de
      # todos. Faça backup dela separado do backup do banco.
      CRIPTO_CHAVE: "="
      CRIPTO_CHAVE_ANTERIOR: ""

      # Web Push (VAPID). Gere com: cd api && npm run vapid
      VAPID_PUBLIC: ""
      VAPID_PRIVATE: ""
      VAPID_CONTATO: "mailto:suporte@omeujardim.app"
      LEMBRETES_INLINE: "true"

      # Força bruta: login baixo, refresh ~60/h.
      LOGIN_RATE_MAX: "10"
      REFRESH_RATE_MAX: "60"

      # ---- Efí (pagamentos). Comece em sandbox. ----
      EFI_SANDBOX: "false"
      EFI_CLIENT_ID: ""
      EFI_CLIENT_SECRET: ""
      # O .p12 vem por docker secret em base64 (texto — dá para criar pela caixa
      # de texto do Portainer). O boot decodifica para este arquivo, e o efi.js
      # (que aceita caminho absoluto) lê daqui. Enquanto o secret não existir
      # (fase sandbox), o boot pula a decodificação.
      EFI_CERTIFICADO: "/app/api/certs/efi.p12"
      EFI_WEBHOOK_SEGREDO: ""
      EFI_PLANO_NOME: "O meu jardim"
      EFI_PLANO_VALOR_CENTAVOS: "1990"
      EFI_PLANO_CICLO: "mensal"
      EFI_TRIAL_DIAS: "7"
      EFI_PLANO_ID: ""
      EFI_PIX_CHAVE: ""
      EFI_WEBHOOK_URL: "https://api.omeujardim.app/v1/webhooks/efi?segredo="
    volumes:
      - jardim_api:/app
      # Cache dos modelos de embedding, para não baixar a cada reinício.
      - jardim_modelos:/app/api/.cache
    secrets:
      # Só a API enxerga o certificado; web e painel não recebem.
      - cert_prod_meujardim
    working_dir: /app
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        set -e;
        export DEBIAN_FRONTEND=noninteractive;
        apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null;
        cd /app;
        if [ ! -d .git ]; then
          echo "Inicializando o repositório em /app...";
          git init -q;
          git remote add origin "$$REPO";
        fi;
        echo "Buscando origin/$$RAMO...";
        git fetch --depth 1 origin "$$RAMO";
        git reset --hard FETCH_HEAD;
        cd /app/api;
        npm ci --include=dev;
        if [ -f /run/secrets/cert_prod_meujardim ]; then
          echo "Decodificando o certificado da Efí...";
          mkdir -p /app/api/certs;
          base64 -d /run/secrets/cert_prod_meujardim > /app/api/certs/efi.p12;
        fi;
        echo "Aguardando o banco aceitar conexão...";
        until pg_isready -d "$$DATABASE_URL" >/dev/null 2>&1; do sleep 2; done;
        echo "Extensões e configuração de busca (idempotente)...";
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/extensoes.sql;
        echo "Migrações (sync é proibido no projeto)...";
        node_modules/.bin/sequelize-cli db:migrate;
        echo "Subindo a API na porta $$PORT...";
        exec node src/servidor.js;
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.jardim-api.rule=Host(`api.omeujardim.app`)"
        - "traefik.http.routers.jardim-api.entrypoints=websecure"
        - "traefik.http.routers.jardim-api.tls=true"
        - "traefik.http.routers.jardim-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.jardim-api.service=jardim-api"
        - "traefik.http.services.jardim-api.loadbalancer.server.port=3000"
        # http -> https
        - "traefik.http.routers.jardim-api-http.rule=Host(`api.omeujardim.app`)"
        - "traefik.http.routers.jardim-api-http.entrypoints=web"
        - "traefik.http.routers.jardim-api-http.middlewares=redirect-to-https"

  # ---- App web (Expo, saída estática) ------------------------------------
  # As EXPO_PUBLIC_* são lidas no BUILD e ficam embutidas no bundle; por isso
  # vão no environment antes do "expo export".
  web:
    image: node:22
    networks:
      - network_public
    environment:
      REPO: *repo
      RAMO: *ramo
      EXPO_PUBLIC_API_URL: "https://api.omeujardim.app"
      EXPO_PUBLIC_EFI_PAYEE_CODE: ""
      EXPO_PUBLIC_EFI_SANDBOX: "false"
    volumes:
      - jardim_web:/app
    working_dir: /app
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        set -e;
        cd /app;
        if [ ! -d .git ]; then
          echo "Inicializando o repositório em /app...";
          git init -q;
          git remote add origin "$$REPO";
        fi;
        echo "Buscando origin/$$RAMO...";
        git fetch --depth 1 origin "$$RAMO";
        git reset --hard FETCH_HEAD;
        cd /app/app;
        npm ci;
        echo "Gerando o estático (web.output: static) em ./dist...";
        npx expo export --platform web;
        echo "Servindo o estático na porta 3000...";
        npm i -g serve@14 >/dev/null 2>&1;
        exec serve dist -l tcp://0.0.0.0:3000;
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.jardim-web.rule=Host(`omeujardim.app`) || Host(`www.omeujardim.app`)"
        - "traefik.http.routers.jardim-web.entrypoints=websecure"
        - "traefik.http.routers.jardim-web.tls=true"
        - "traefik.http.routers.jardim-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.jardim-web.service=jardim-web"
        - "traefik.http.services.jardim-web.loadbalancer.server.port=3000"
        # http -> https
        - "traefik.http.routers.jardim-web-http.rule=Host(`omeujardim.app`) || Host(`www.omeujardim.app`)"
        - "traefik.http.routers.jardim-web-http.entrypoints=web"
        - "traefik.http.routers.jardim-web-http.middlewares=redirect-to-https"
        # o próprio middleware de redirecionamento (definido uma vez, usado por todos)
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  # ---- Painel de gestão (HTML único) -------------------------------------
  # Troca o endereço padrão da API (localhost) pelo de produção no clone.
  painel:
    image: node:22
    networks:
      - network_public
    environment:
      REPO: *repo
      RAMO: *ramo
    volumes:
      - jardim_painel:/app
    working_dir: /app
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        set -e;
        cd /app;
        if [ ! -d .git ]; then
          echo "Inicializando o repositório em /app...";
          git init -q;
          git remote add origin "$$REPO";
        fi;
        echo "Buscando origin/$$RAMO...";
        git fetch --depth 1 origin "$$RAMO";
        git reset --hard FETCH_HEAD;
        cd /app/painel;
        sed -i "s#http://localhost:3337#https://api.omeujardim.app#g" index.html;
        echo "Servindo o painel na porta 3000...";
        npm i -g serve@14 >/dev/null 2>&1;
        exec serve . -l tcp://0.0.0.0:3000;
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.jardim-painel.rule=Host(`painel.omeujardim.app`)"
        - "traefik.http.routers.jardim-painel.entrypoints=websecure"
        - "traefik.http.routers.jardim-painel.tls=true"
        - "traefik.http.routers.jardim-painel.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.jardim-painel.service=jardim-painel"
        - "traefik.http.services.jardim-painel.loadbalancer.server.port=3000"
        # http -> https
        - "traefik.http.routers.jardim-painel-http.rule=Host(`painel.omeujardim.app`)"
        - "traefik.http.routers.jardim-painel-http.entrypoints=web"
        - "traefik.http.routers.jardim-painel-http.middlewares=redirect-to-https"


# O .p12 vira base64 (texto) e entra como secret pela caixa de texto do Portainer.
# O boot decodifica de volta para /app/api/certs/efi.p12. Secret não se edita:
# para trocar o certificado, crie com outro nome, aponte aqui e no serviço "api",
# e re-deploye.
secrets:
  cert_prod_meujardim:
    external: true

networks:
  network_public:
    external: true

volumes:
  jardim_api:
  jardim_web:
  jardim_painel:
  jardim_modelos:
