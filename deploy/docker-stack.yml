version: "3.9"

# ============================================================================
# O meu jardim — deploy no estilo Swarm + Traefik, clonando o repo em runtime
# (sem buildar imagem). Modelo do seu exemplo, encaixado neste projeto:
#
#   - Três serviços web, cada um no seu domínio (é assim que o projeto já é
#     pensado em deploy/.env: DOMINIO, API_DOMINIO, PAINEL_DOMINIO):
#       api.omeujardim.app.br     -> API Fastify (porta 3000)
#       omeujardim.app.br         -> app Expo (saída estática, servido por "serve")
#       painel.omeujardim.app.br  -> painel de gestão (HTML único)
#   - Dois serviços internos, SEM porta pública e SEM rota no Traefik:
#       banco  -> Postgres 16 com pgvector
#       cache  -> Redis (o rate limit passa a valer para todas as réplicas)
#
# Pressupõe um Traefik já rodando no enxame, com o entrypoint "websecure",
# o resolver "letsencryptresolver" e a rede externa "network_public" — igual
# ao seu exemplo. Não subimos Traefik aqui.
#
# Subir:   docker stack deploy -c deploy/docker-stack.yml jardim
# Ver:     docker service ls   |   docker service logs -f jardim_api
#
# TROQUE tudo marcado com <...>. Gere segredos NOVOS para produção:
#   openssl rand -base64 32   (JWT_SEGREDO, CRIPTO_CHAVE)
#   openssl rand -hex 16      (EFI_WEBHOOK_SEGREDO, se quiser)
#
# Diferenças em relação ao Dockerfile do projeto, de propósito, por causa do
# "clone em runtime":
#   - Não há bind mount de arquivos do repo (o Swarm roda em qualquer nó do
#     enxame). Por isso a extensoes.sql roda via psql a partir do container da
#     API, depois do clone, e não como initdb-script do Postgres.
#   - depends_on com condição NÃO vale em Swarm. A API espera o banco com
#     pg_isready antes de migrar; restart_policy cobre o resto.
#   - node:22 (imagem cheia) traz git, python3, make e g++, necessários para o
#     argon2 nativo compilar no npm ci. Não use a variante -slim aqui.
# ============================================================================

x-repo: &repo "https://github.com/<USUARIO>/omeujardim.git"   # <-- URL do repositório
x-ramo: &ramo "main"

services:
  # ---- API Fastify -------------------------------------------------------
  api:
    image: node:22
    networks:
      - network_public
      - interna
    environment:
      REPO: *repo
      RAMO: *ramo
      NODE_ENV: production
      PORT: "3000"

      # Banco interno deste stack (serviço "banco"). Para um Postgres gerenciado
      # externo, troque a URL e ponha DB_SSL=true.
      DATABASE_URL: "postgres://jardim:<SENHA_DO_BANCO>@banco:5432/meujardim"
      DB_SSL: "false"
      REDIS_URL: "redis://cache:6379"

      # App e painel, em https, sem espaços.
      CORS_ORIGENS: "https://omeujardim.app.br,https://painel.omeujardim.app.br"

      # Segredos — gere NOVOS, não reaproveite os de desenvolvimento.
      JWT_SEGREDO: "<openssl rand -base64 32>"
      JWT_EXPIRA: "15m"
      REFRESH_EXPIRA_DIAS: "30"
      # Cifra o diário (AES-256-GCM). Perder esta chave = perder o diário de
      # todos. Faça backup dela separado do backup do banco.
      CRIPTO_CHAVE: "<openssl rand -base64 32>"
      CRIPTO_CHAVE_ANTERIOR: ""

      # Web Push (VAPID). Gere com: cd api && npm run vapid
      VAPID_PUBLIC: ""
      VAPID_PRIVATE: ""
      VAPID_CONTATO: "mailto:jardim@omeujardim.app.br"
      LEMBRETES_INLINE: "true"

      # Força bruta: login baixo, refresh ~60/h.
      LOGIN_RATE_MAX: "10"
      REFRESH_RATE_MAX: "60"

      # ---- Efí (pagamentos). Comece em sandbox. ----
      EFI_SANDBOX: "true"
      EFI_CLIENT_ID: ""
      EFI_CLIENT_SECRET: ""
      # Caminho do .p12 relativo a api/ (o volume abaixo monta em /app/api/certs).
      EFI_CERTIFICADO: "./certs/seu-certificado.p12"
      EFI_WEBHOOK_SEGREDO: "<TROQUE>"
      EFI_PLANO_NOME: "O meu jardim"
      EFI_PLANO_VALOR_CENTAVOS: "1990"
      EFI_PLANO_CICLO: "mensal"
      EFI_TRIAL_DIAS: "7"
      EFI_PLANO_ID: ""
      EFI_PIX_CHAVE: ""
      EFI_WEBHOOK_URL: "https://api.omeujardim.app.br/v1/webhooks/efi?segredo=<TROQUE>"
    volumes:
      - jardim_api:/app
      # Cache dos modelos de embedding, para não baixar a cada reinício.
      - jardim_modelos:/app/api/.cache
      # Certificado .p12 da Efí, colocado à mão no nó manager (fora do repo).
      # Descomente quando for para a Efí ao vivo.
      # - /opt/jardim/certs:/app/api/certs:ro
    working_dir: /app
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        set -e;
        apt-get update >/dev/null && apt-get install -y --no-install-recommends postgresql-client >/dev/null;
        if [ ! -d /app/.git ]; then
          echo "Clonando o repositório...";
          rm -rf /app/* /app/.[!.]* 2>/dev/null || true;
          git clone --branch "$$RAMO" "$$REPO" /app;
        else
          echo "Atualizando o repositório...";
          cd /app; git fetch origin "$$RAMO"; git reset --hard "origin/$$RAMO";
        fi;
        cd /app/api;
        npm ci;
        echo "Aguardando o banco aceitar conexão...";
        until pg_isready -d "$$DATABASE_URL" >/dev/null 2>&1; do sleep 2; done;
        echo "Extensões e configuração de busca (idempotente)...";
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/extensoes.sql;
        echo "Migrações (sync é proibido no projeto)...";
        node_modules/.bin/sequelize-cli db:migrate;
        echo "Subindo a API na porta $$PORT...";
        exec node src/servidor.js;
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.jardim-api.rule=Host(`api.omeujardim.app.br`)"
        - "traefik.http.routers.jardim-api.entrypoints=websecure"
        - "traefik.http.routers.jardim-api.tls=true"
        - "traefik.http.routers.jardim-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.jardim-api.service=jardim-api"
        - "traefik.http.services.jardim-api.loadbalancer.server.port=3000"
        # http -> https
        - "traefik.http.routers.jardim-api-http.rule=Host(`api.omeujardim.app.br`)"
        - "traefik.http.routers.jardim-api-http.entrypoints=web"
        - "traefik.http.routers.jardim-api-http.middlewares=redirect-to-https"

  # ---- App web (Expo, saída estática) ------------------------------------
  # As EXPO_PUBLIC_* são lidas no BUILD e ficam embutidas no bundle; por isso
  # vão no environment antes do "expo export".
  web:
    image: node:22
    networks:
      - network_public
    environment:
      REPO: *repo
      RAMO: *ramo
      EXPO_PUBLIC_API_URL: "https://api.omeujardim.app.br"
      EXPO_PUBLIC_EFI_PAYEE_CODE: ""
      EXPO_PUBLIC_EFI_SANDBOX: "false"
    volumes:
      - jardim_web:/app
    working_dir: /app
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        set -e;
        if [ ! -d /app/.git ]; then
          echo "Clonando o repositório...";
          rm -rf /app/* /app/.[!.]* 2>/dev/null || true;
          git clone --branch "$$RAMO" "$$REPO" /app;
        else
          echo "Atualizando o repositório...";
          cd /app; git fetch origin "$$RAMO"; git reset --hard "origin/$$RAMO";
        fi;
        cd /app/app;
        npm ci;
        echo "Gerando o estático (web.output: static) em ./dist...";
        npx expo export --platform web;
        echo "Servindo o estático na porta 3000...";
        exec npx --yes serve dist -l 3000;
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.jardim-web.rule=Host(`omeujardim.app.br`) || Host(`www.omeujardim.app.br`)"
        - "traefik.http.routers.jardim-web.entrypoints=websecure"
        - "traefik.http.routers.jardim-web.tls=true"
        - "traefik.http.routers.jardim-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.jardim-web.service=jardim-web"
        - "traefik.http.services.jardim-web.loadbalancer.server.port=3000"
        # http -> https
        - "traefik.http.routers.jardim-web-http.rule=Host(`omeujardim.app.br`) || Host(`www.omeujardim.app.br`)"
        - "traefik.http.routers.jardim-web-http.entrypoints=web"
        - "traefik.http.routers.jardim-web-http.middlewares=redirect-to-https"
        # o próprio middleware de redirecionamento (definido uma vez, usado por todos)
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  # ---- Painel de gestão (HTML único) -------------------------------------
  # Troca o endereço padrão da API (localhost) pelo de produção no clone.
  painel:
    image: node:22
    networks:
      - network_public
    environment:
      REPO: *repo
      RAMO: *ramo
    volumes:
      - jardim_painel:/app
    working_dir: /app
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - >
        set -e;
        if [ ! -d /app/.git ]; then
          echo "Clonando o repositório...";
          rm -rf /app/* /app/.[!.]* 2>/dev/null || true;
          git clone --branch "$$RAMO" "$$REPO" /app;
        else
          echo "Atualizando o repositório...";
          cd /app; git fetch origin "$$RAMO"; git reset --hard "origin/$$RAMO";
        fi;
        cd /app/painel;
        sed -i "s#http://localhost:3337#https://api.omeujardim.app.br#g" index.html;
        echo "Servindo o painel na porta 3000...";
        exec npx --yes serve . -l 3000;
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.jardim-painel.rule=Host(`painel.omeujardim.app.br`)"
        - "traefik.http.routers.jardim-painel.entrypoints=websecure"
        - "traefik.http.routers.jardim-painel.tls=true"
        - "traefik.http.routers.jardim-painel.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.jardim-painel.service=jardim-painel"
        - "traefik.http.services.jardim-painel.loadbalancer.server.port=3000"
        # http -> https
        - "traefik.http.routers.jardim-painel-http.rule=Host(`painel.omeujardim.app.br`)"
        - "traefik.http.routers.jardim-painel-http.entrypoints=web"
        - "traefik.http.routers.jardim-painel-http.middlewares=redirect-to-https"

  # ---- Postgres 16 com pgvector (interno) --------------------------------
  banco:
    image: pgvector/pgvector:pg16
    networks:
      - interna
    environment:
      POSTGRES_DB: meujardim
      POSTGRES_USER: jardim
      POSTGRES_PASSWORD: "<SENHA_DO_BANCO>"
      LANG: pt_BR.utf8
    volumes:
      - jardim_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jardim -d meujardim"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        # Fixa no manager para o volume de dados morar sempre no mesmo nó.
        constraints:
          - node.role == manager

  # ---- Redis (interno) ---------------------------------------------------
  cache:
    image: redis:7-alpine
    networks:
      - interna
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager

networks:
  network_public:
    external: true
  interna:
    driver: overlay
    # Sem saída para o Traefik: banco e cache só falam com a API.
    internal: true

volumes:
  jardim_api:
  jardim_web:
  jardim_painel:
  jardim_dados:
  jardim_modelos:
